[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cocapn-curriculum"
version = "3.0.0"
description = "FLUX v3.0 Competency DAG — compiled bytecode modules with dynamic linking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["flux", "vm", "agent", "curriculum", "dag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
cocapn-curriculum = "cocapn_curriculum_flux:main"

[tool.hatch.build.targets.wheel]
packages = ["cocapn_curriculum_flux.py"]
